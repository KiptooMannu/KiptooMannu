name: Update Profile Cards

on:
  schedule:
    - cron: "0 4 * * *"   # daily at 04:00 UTC
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure profile directory exists
        run: mkdir -p profile

      - name: Fetch GitHub Stats card
        run: |
          curl -sSL "https://github-readme-stats.vercel.app/api?username=KiptooMannu&show_icons=true&theme=tokyonight&hide_border=true&count_private=true&title_color=6E40C9&icon_color=6E40C9&text_color=c9d1d9&bg_color=00000000" \
            -o profile/stats.svg

      - name: Fetch Top Languages card
        run: |
          curl -sSL "https://github-readme-stats.vercel.app/api/top-langs/?username=KiptooMannu&layout=compact&theme=tokyonight&hide_border=true&title_color=6E40C9&text_color=c9d1d9&bg_color=00000000" \
            -o profile/top-langs.svg

      - name: Fetch Streak Stats card
        run: |
          curl -sSL "https://github-readme-streak-stats.herokuapp.com/?user=KiptooMannu&theme=tokyonight&hide_border=true&ring=6E40C9&fire=6E40C9&background=00000000" \
            -o profile/streak.svg

      - name: Fetch Trophy card
        run: |
          curl -sSL "https://github-profile-trophy.vercel.app/?username=KiptooMannu&theme=algolia&no-frame=true&no-bg=true&row=1&column=6" \
            -o profile/trophy.svg

      - name: Verify downloads are valid SVGs, not error pages
        run: |
          for f in profile/stats.svg profile/top-langs.svg profile/streak.svg profile/trophy.svg; do
            if ! head -c 300 "$f" | grep -qi "<svg"; then
              echo "::warning::$f did not come back as a valid SVG — reverting to the last known-good version."
              git checkout -- "$f" 2>/dev/null || true
            fi
          done

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg profile/streak.svg profile/trophy.svg
          git diff --quiet --cached || git commit -m "chore: refresh profile stat cards [skip ci]"
          git push
