name: Update Profile Cards

on:
  schedule:
    - cron: "0 4 * * *"   # daily at 04:00 UTC
  workflow_dispatch: {}
  push:
    branches:
      - main

# Serializes this workflow against the other profile-writing workflows
# (rank-projects.yml, snake.yml) so they never race to push to main at
# the same time. Runs queue instead of overlapping.
concurrency:
  group: profile-repo-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure profile directory exists
        run: mkdir -p profile

      - name: Write fetch helper script
        run: |
          cat > fetch_card.sh << 'SCRIPT_EOF'
          #!/usr/bin/env bash
          set -uo pipefail

          fetch_card () {
            url="$1"
            out="$2"
            label="$3"
            tmp="$(mktemp)"

            for attempt in 1 2 3; do
              curl -sSL --max-time 20 "$url" -o "$tmp" && break
              echo "Attempt $attempt for $label failed, retrying..."
              sleep 5
            done

            if [ -s "$tmp" ] && head -c 300 "$tmp" | grep -qi "<svg"; then
              mv "$tmp" "$out"
              echo "$label: OK"
            elif [ -f "$out" ]; then
              echo "$label: fetch failed, keeping previous committed version"
              rm -f "$tmp"
            else
              echo "$label: fetch failed and no previous version exists, writing placeholder"
              printf '%s\n' \
                '<svg xmlns="http://www.w3.org/2000/svg" width="495" height="120" viewBox="0 0 495 120">' \
                '  <rect width="495" height="120" rx="8" fill="#0d1117" stroke="#30363d"/>' \
                '  <text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" fill="#6E40C9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16">' \
                "    ${label} - run the workflow to generate" \
                '  </text>' \
                '</svg>' > "$out"
              rm -f "$tmp"
            fi
          }

          fetch_card "https://github-readme-stats.vercel.app/api?username=KiptooMannu&show_icons=true&theme=tokyonight&hide_border=true&count_private=true&title_color=6E40C9&icon_color=6E40C9&text_color=c9d1d9&bg_color=00000000" "profile/stats.svg" "GitHub Stats"

          fetch_card "https://github-readme-stats.vercel.app/api/top-langs/?username=KiptooMannu&layout=compact&theme=tokyonight&hide_border=true&title_color=6E40C9&text_color=c9d1d9&bg_color=00000000" "profile/top-langs.svg" "Top Languages"

          fetch_card "https://github-readme-streak-stats.herokuapp.com/?user=KiptooMannu&theme=tokyonight&hide_border=true&ring=6E40C9&fire=6E40C9&background=00000000" "profile/streak.svg" "Streak Stats"

          fetch_card "https://github-profile-trophy.vercel.app/?username=KiptooMannu&theme=algolia&no-frame=true&no-bg=true&row=1&column=6" "profile/trophy.svg" "GitHub Trophies"
          SCRIPT_EOF
          chmod +x fetch_card.sh

      - name: Fetch all cards with fallback
        run: ./fetch_card.sh

      - name: Clean up helper script
        run: rm -f fetch_card.sh

      - name: Commit and push with retry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg profile/streak.svg profile/trophy.svg

          if git diff --quiet --cached; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: refresh profile stat cards [skip ci]"

          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Push rejected on attempt $attempt, pulling and rebasing..."
            git pull --rebase origin main
            sleep $((attempt * 3))
          done

          echo "Push failed after multiple attempts."
          exit 1
