name: Update Profile Cards

on:
  schedule:
    - cron: "0 3 * * *"   # daily at 03:00 UTC
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate GitHub Stats card
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&hide_border=true&count_private=true&include_all_commits=true&rank_icon=github
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Top Languages card
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=tokyonight&hide_border=true&langs_count=8
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Streak Stats card
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&theme=tokyonight&hide_border=true
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Trophy card
        run: |
          mkdir -p profile
          curl -L --retry 3 --retry-delay 5 -o profile/trophy.svg "https://github-profile-trophy.vercel.app/?username=${{ github.repository_owner }}&theme=tokyonight&no-frame=true&column=4&row=2"

      # Generate Pin cards for featured projects
      - name: Generate Pin card - Filtering JOBS
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=Filtering_JOBS-&theme=tokyonight&hide_border=true
          path: profile/pin-1.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Pin card - Dark Mode Dashboard
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=Dark-Mode-Light-Mode-Switch-Dashboard&theme=tokyonight&hide_border=true
          path: profile/pin-2.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Pin card - Image Search App
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=Image-Search-App-With-API&theme=tokyonight&hide_border=true
          path: profile/pin-3.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Pin card - Rest Countries API
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=Rest-Countries-API-with-Theme-Switcher&theme=tokyonight&hide_border=true
          path: profile/pin-4.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Pin card - News Home Pages
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=News--home--pages-Flex-Assignment&theme=tokyonight&hide_border=true
          path: profile/pin-5.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --cached --quiet && echo "No changes" || git commit -m "chore: refresh profile cards [skip ci]"
          git push
