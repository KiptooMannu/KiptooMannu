name: Update Profile Cards

on:
  schedule:
    - cron: "0 3 * * *"   # daily at 03:00 UTC
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate GitHub Stats card
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&hide_border=true&count_private=true&include_all_commits=true&rank_icon=github
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Top Languages card
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=tokyonight&hide_border=true&langs_count=8
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Streak Stats card
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&theme=tokyonight&hide_border=true
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Trophy card
        run: |
          mkdir -p profile
          curl -L --retry 3 --retry-delay 5 -o profile/trophy.svg "https://github-profile-trophy.vercel.app/?username=${{ github.repository_owner }}&theme=tokyonight&no-frame=true&column=4&row=2"

      - name: Get top repositories by commits
        id: get-repos
        run: |
          # Fetch all repos sorted by pushed_at (recent activity)
          repos=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/users/${{ github.repository_owner }}/repos?sort=pushed&direction=desc&per_page=100&type=owner")
          
          # Extract repo names (excluding forks and the profile repo)
          echo "$repos" | jq -r '.[] | select(.fork == false) | select(.name != "'${{ github.repository_owner }}'") | .name' | head -5 > /tmp/top-repos.txt
          
          # Display selected repos
          echo "Selected repositories:"
          cat /tmp/top-repos.txt

      - name: Generate Pin card - Project 1
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=$(sed -n '1p' /tmp/top-repos.txt)&theme=tokyonight&hide_border=true
          path: profile/pin-1.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Pin card - Project 2
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=$(sed -n '2p' /tmp/top-repos.txt)&theme=tokyonight&hide_border=true
          path: profile/pin-2.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Pin card - Project 3
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=$(sed -n '3p' /tmp/top-repos.txt)&theme=tokyonight&hide_border=true
          path: profile/pin-3.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Pin card - Project 4
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=$(sed -n '4p' /tmp/top-repos.txt)&theme=tokyonight&hide_border=true
          path: profile/pin-4.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Pin card - Project 5
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=$(sed -n '5p' /tmp/top-repos.txt)&theme=tokyonight&hide_border=true
          path: profile/pin-5.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --cached --quiet && echo "No changes" || git commit -m "chore: refresh profile cards [skip ci]"
          git push
