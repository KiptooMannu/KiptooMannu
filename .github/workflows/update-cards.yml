name: Update Profile Cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths-ignore:
      - 'profile/**'

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate GitHub Stats card
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&hide_border=true&count_private=true&include_all_commits=true&rank_icon=github
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Top Languages card
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=tokyonight&hide_border=true&langs_count=8
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Streak Stats card
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&theme=tokyonight&hide_border=true
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Trophy card
        run: |
          mkdir -p profile
          curl -L --retry 3 --retry-delay 5 -o profile/trophy.svg "https://github-profile-trophy.vercel.app/?username=${{ github.repository_owner }}&theme=tokyonight&no-frame=true&column=4&row=2" || echo "Warning: Trophy generation failed"

      - name: Generate Pin cards
        run: |
          mkdir -p profile
          
          # Fetch top repos
          curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/users/${{ github.repository_owner }}/repos?sort=pushed&direction=desc&per_page=100&type=owner" > /tmp/repos.json
          
          # Get top 5 repo names
          jq -r '.[] | select(.fork == false) | select(.name != "'${{ github.repository_owner }}'") | .name' /tmp/repos.json | head -5 > /tmp/top_repos.txt
          
          # Generate pin cards
          counter=1
          while read repo; do
            echo "Generating card for: $repo"
            
            # Get repo data
            name=$(jq -r ".[] | select(.name == \"$repo\") | .name" /tmp/repos.json)
            desc=$(jq -r ".[] | select(.name == \"$repo\") | .description" /tmp/repos.json)
            stars=$(jq -r ".[] | select(.name == \"$repo\") | .stargazers_count" /tmp/repos.json)
            forks=$(jq -r ".[] | select(.name == \"$repo\") | .forks_count" /tmp/repos.json)
            lang=$(jq -r ".[] | select(.name == \"$repo\") | .language" /tmp/repos.json)
            
            # Handle null values
            if [ "$desc" = "null" ] || [ -z "$desc" ]; then
              desc="No description"
            fi
            if [ "$lang" = "null" ] || [ -z "$lang" ]; then
              lang="N/A"
            fi
            
            # Create SVG
            echo "<svg width=\"400\" height=\"150\" xmlns=\"http://www.w3.org/2000/svg\">" > "profile/pin-$counter.svg"
            echo "  <rect width=\"400\" height=\"150\" rx=\"10\" fill=\"#1a1b27\" stroke=\"#70a5fd\" stroke-width=\"2\"/>" >> "profile/pin-$counter.svg"
            echo "  <text x=\"20\" y=\"35\" font-family=\"Arial\" font-size=\"18\" font-weight=\"bold\" fill=\"#70a5fd\">$name</text>" >> "profile/pin-$counter.svg"
            echo "  <text x=\"20\" y=\"65\" font-family=\"Arial\" font-size=\"14\" fill=\"#a9b1d6\">$desc</text>" >> "profile/pin-$counter.svg"
            echo "  <text x=\"20\" y=\"95\" font-family=\"Arial\" font-size=\"13\" fill=\"#9ece6a\">Stars: $stars | Forks: $forks | Language: $lang</text>" >> "profile/pin-$counter.svg"
            echo "  <text x=\"20\" y=\"120\" font-family=\"Arial\" font-size=\"12\" fill=\"#7aa2f7\">github.com/${{ github.repository_owner }}/$repo</text>" >> "profile/pin-$counter.svg"
            echo "</svg>" >> "profile/pin-$counter.svg"
            
            echo "Created profile/pin-$counter.svg"
            counter=$((counter + 1))
          done < /tmp/top_repos.txt

      - name: Commit and push cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git pull --rebase origin main || true
          
          git add profile/*.svg
          
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: refresh profile cards [skip ci]"
            
            for attempt in 1 2 3; do
              echo "Push attempt $attempt"
              if git push origin main; then
                echo "Successfully pushed"
                break
              else
                git pull --rebase origin main || true
                sleep 5
              fi
            done
          fi

      - name: Summary
        run: |
          echo "Generated files:"
          ls -la profile/*.svg
          echo "Workflow completed!"
