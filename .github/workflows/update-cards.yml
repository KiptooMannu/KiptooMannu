name: Update Profile Cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths-ignore:
      - 'profile/**'

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate GitHub Stats card
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&hide_border=true&count_private=true&include_all_commits=true&rank_icon=github
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Top Languages card
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=tokyonight&hide_border=true&langs_count=8
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Streak Stats card
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&theme=tokyonight&hide_border=true
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Trophy card
        run: |
          mkdir -p profile
          curl -L --retry 3 --retry-delay 5 \
            -o profile/trophy.svg \
            "https://github-profile-trophy.vercel.app/?username=${{ github.repository_owner }}&theme=tokyonight&no-frame=true&column=4&row=2" \
            || echo "Warning: Trophy generation failed"

      - name: Generate Pin cards using GitHub API
        run: |
          # Create directory if it doesn't exist
          mkdir -p profile
          
          # Fetch all repos sorted by recent activity
          repos=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/users/${{ github.repository_owner }}/repos?sort=pushed&direction=desc&per_page=100&type=owner")
          
          # Extract top 5 non-fork, non-profile repos with their data
          echo "$repos" | jq -r '.[] | select(.fork == false) | select(.name != "'${{ github.repository_owner }}'") | [.name, .description, .stargazers_count, .forks_count, .language, .html_url] | @tsv' | head -5 > /tmp/top_repos.tsv
          
          # Display selected repos
          echo "Selected repositories:"
          cat /tmp/top_repos.tsv
          
          # Generate custom SVG pin cards
          counter=1
          while IFS=$'\t' read -r repo_name description stars forks language url; do
            echo "Generating pin card for: $repo_name"
            
            # Clean description (handle null)
            if [ "$description" = "null" ] || [ -z "$description" ]; then
              description="No description provided"
            fi
            
            # Clean language (handle null)
            if [ "$language" = "null" ] || [ -z "$language" ]; then
              language="N/A"
            fi
            
            # Truncate description
            short_description=$(echo "$description" | cut -c1-60)
            if [ ${#description} -gt 60 ]; then
              short_description="${short_description}..."
            fi
            
            # Generate custom SVG pin card
            cat > "profile/pin-$counter.svg" << 'SVGEOF'
<svg width="400" height="150" viewBox="0 0 400 150" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Repository Card">
  <style>
    .card-bg { fill: #1a1b27; stroke: #70a5fd; stroke-width: 2; }
    .repo-name { font: bold 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #70a5fd; }
    .repo-desc { font: 14px 'Segoe UI', Ubuntu, Sans-Serif; fill: #a9b1d6; }
    .repo-stats { font: 13px 'Segoe UI', Ubuntu, Sans-Serif; fill: #9ece6a; }
    .repo-link { font: 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #7aa2f7; }
  </style>
  <rect x="0.5" y="0.5" width="399" height="149" rx="10" class="card-bg"/>
SVGEOF
            
            # Append dynamic content
            cat >> "profile/pin-$counter.svg" << EOF
  <text x="20" y="35" class="repo-name">$repo_name</text>
  <text x="20" y="65" class="repo-desc">$short_description</text>
  <text x="20" y="95" class="repo-stats">Stars: $stars | Forks: $forks | Language: $language</text>
  <text x="20" y="120" class="repo-link">$url</text>
</svg>
EOF
            
            echo "✓ Created profile/pin-$counter.svg for $repo_name"
            counter=$((counter + 1))
          done < /tmp/top_repos.tsv

      - name: Commit and push cards
        run: |
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Pull latest changes with rebase
          echo "Pulling latest changes..."
          git pull --rebase origin main || true
          
          # Add all SVG files
          git add profile/*.svg
          
          # Check if there are changes to commit
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            echo "Changes detected, committing..."
            git commit -m "chore: refresh profile cards [skip ci]"
            
            # Push with retry logic
            for attempt in 1 2 3; do
              echo "Push attempt $attempt..."
              if git push origin main; then
                echo "Successfully pushed to main"
                break
              else
                echo "Push failed, pulling and retrying..."
                git pull --rebase origin main || true
                sleep 5
              fi
            done
          fi

      - name: Summary
        run: |
          echo "===================="
          echo "Generated files:"
          ls -la profile/*.svg
          echo "===================="
          echo "Checking file sizes..."
          for f in profile/*.svg; do
            size=$(stat -c%s "$f")
            if [ $size -lt 1000 ]; then
              echo "Warning: $f is small ($size bytes) - might be an error"
            else
              echo "OK: $f: $size bytes"
            fi
          done
          echo "===================="
          echo "Workflow completed successfully!"
