name: Update Profile Cards

on:
  schedule:
    - cron: "0 3 * * *"   # daily at 03:00 UTC
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate GitHub Stats card
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&hide_border=true&count_private=true&include_all_commits=true&rank_icon=github
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Top Languages card
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=tokyonight&hide_border=true&langs_count=8
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Streak Stats card
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&theme=tokyonight&hide_border=true
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Trophy card
        run: |
          mkdir -p profile
          curl -L --retry 3 --retry-delay 5 -o profile/trophy.svg "https://github-profile-trophy.vercel.app/?username=${{ github.repository_owner }}&theme=tokyonight&no-frame=true&column=4&row=2"

      - name: Generate Pin cards for top repositories
        run: |
          # Create directory if it doesn't exist
          mkdir -p profile
          
          # Fetch all repos sorted by recent activity
          repos=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/users/${{ github.repository_owner }}/repos?sort=pushed&direction=desc&per_page=100&type=owner")
          
          # Extract top 5 non-fork, non-profile repos
          top_repos=$(echo "$repos" | jq -r '.[] | select(.fork == false) | select(.name != "'${{ github.repository_owner }}'") | .name' | head -5)
          
          # Generate pin cards for each repo
          counter=1
          for repo in $top_repos; do
            echo "Generating pin card for: $repo"
            
            # URL encode the repo name for the API
            encoded_repo=$(echo "$repo" | jq -sRr @uri)
            
            # Fetch pin card from GitHub API
            curl -L --retry 3 --retry-delay 5 \
              -o "profile/pin-$counter.svg" \
              "https://github-readme-stats.vercel.app/api/pin/?username=${{ github.repository_owner }}&repo=$encoded_repo&theme=tokyonight&hide_border=true"
            
            # Check if the file was created successfully
            if [ -f "profile/pin-$counter.svg" ]; then
              echo "✓ Created profile/pin-$counter.svg for $repo"
            else
              echo "✗ Failed to create pin card for $repo"
            fi
            
            counter=$((counter + 1))
          done

      - name: Commit and push cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --cached --quiet && echo "No changes" || git commit -m "chore: refresh profile cards [skip ci]"
          git push
