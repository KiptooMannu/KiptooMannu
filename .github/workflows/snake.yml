name: Generate Snake Animation

on:
  schedule:
    # Runs every 6 hours — regenerates the SVG from your real contribution graph
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake SVG/GIF
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: KiptooMannu
          outputs: |
            profile/github-contribution-grid-snake.svg
            profile/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Commit snake output to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/github-contribution-grid-snake*.svg
          git diff --quiet --cached || git commit -m "chore: update contribution snake [skip ci]"
          git push
